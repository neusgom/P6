<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P6_display_flex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: 0;
        }
        :root{
            --primary-color: #FF00BF;
            --secundary-color: #00FF09;
            --terciary-color: #FFFFFF;
        }

        .roboto {
        font-family: "Roboto", sans-serif;
        font-optical-sizing: auto;
        font-weight: <weight>;
        font-style: normal;
        font-variation-settings:
        "wdth" 100;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
        }
        
        #txt {
            display: flex;
            flex: 1;
            flex-direction: column;
            width: 100%;
            height: 100%;            
            background-color: var(--primary-color);
        }
        #txt div{
            display: flex;
            flex: 1;
            }
        div:first-child {
            display: flex;
            flex-direction: row-reverse;
        }
        div:last-child {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
        }
        #verd {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;             
            background-color: var(--secundary-color);
        }
        #rosa {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;             
            background-color: var(--primary-color);
        }


    </style>
</head>
<body>
    <div class="container">
         <div id="txt">
            <div class="roboto">
                <h1>Hola</h1>
            </div>
            <div class="roboto">
                 <h1>Andrea</h1>
            </div>
        </div>
        <div id="verd">

        </div>
        <div id="rosa">

        </div>

    </div>
</body>
</html>
